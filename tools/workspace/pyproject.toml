[project]
name = "llama-receipts-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy>=2,<3", "pyyaml>=6,<7", "tqdm>=4.66,<5", "requests>=2.32,<3", "python-multipart>=0.0.20,<1"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "cryptography>=50.0.1",
    "gguf>=0.19.0",
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
